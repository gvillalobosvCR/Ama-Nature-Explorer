<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="volcanoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Circle for rounded PWA maskable compliance -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <g transform="translate(0, 20)">
    <!-- Volcano Arenal Outline in background -->
    <path d="M 120 360 L 256 160 L 392 360 Z" fill="url(#volcanoGrad)" opacity="0.85" />
    <path d="M 230 198 L 256 160 L 282 198 Z" fill="#fff" opacity="0.9" /> <!-- Lava/Snow peak -->
    
    <!-- Sun / Glow behind Volcano -->
    <circle cx="256" cy="180" r="40" fill="#fef08a" opacity="0.3" filter="blur(8px)" />

    <!-- Foreground Tropical Leaves -->
    <!-- Central Leaf -->
    <path d="M 256 420 C 230 360, 200 320, 256 220 C 312 320, 282 360, 256 420 Z" fill="url(#leafGrad)" />
    <!-- Center Leaf stem line -->
    <path d="M 256 420 L 256 240" stroke="#064e3b" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Left Leaf -->
    <path d="M 240 420 C 180 380, 160 330, 200 260 C 240 330, 250 380, 240 420 Z" fill="url(#leafGrad)" opacity="0.9" transform="rotate(-25 240 420)" />
    
    <!-- Right Leaf -->
    <path d="M 272 420 C 332 380, 352 330, 312 260 C 272 330, 262 380, 272 420 Z" fill="url(#leafGrad)" opacity="0.9" transform="rotate(25 272 420)" />

    <!-- Forest path curving forward -->
    <path d="M 256 360 Q 230 400, 256 450 Q 282 400, 256 360 Z" fill="#78350f" opacity="0.4" />
  </g>
</svg>
